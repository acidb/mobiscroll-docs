name: Algolia crawl (PRODUCTION index)

# Runs weekly on a schedule, and can also be triggered manually — manual runs are gated
# behind a typed confirmation; a scheduled run has no input to type and skips that check
# by design (see "Verify confirmation input" step's `if:` below).
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type CONFIRM to run a real crawl against the live docs_mobiscroll production index'
        required: true
  schedule:
    - cron: '0 3 * * 1'   # 03:00 UTC every Monday

jobs:
  crawl:
    runs-on: ubuntu-latest
    steps:
      - name: Verify confirmation input
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.confirm != 'CONFIRM' }}
        run: |
          echo "::error::Confirmation input did not equal 'CONFIRM'. Aborting to avoid an accidental production crawl."
          exit 1

      - name: Checkout
        uses: actions/checkout@v4

      - name: Build minified crawl config
        run: |
          jq -c . search-config.json > search-config-min.json
          echo "index_name in this run: $(jq -r .index_name search-config-min.json)"

      - name: Guard against wrong index_name
        run: |
          ACTUAL_INDEX=$(jq -r .index_name search-config-min.json)
          if [ "$ACTUAL_INDEX" != "docs_mobiscroll" ]; then
            echo "::error::search-config.json index_name is '$ACTUAL_INDEX', expected 'docs_mobiscroll'. Refusing to run."
            exit 1
          fi

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      # docsearch-scraper crawls into a temporary index and atomically swaps it into the
      # real index name at the very end of its run — that swap is itself async, so the
      # index can briefly still hold OLD data right after the crawl step below reports
      # success. Planting a sentinel now and waiting for it to disappear afterwards (see
      # "Wait for fresh crawl") is how Prune/Tag are kept from ever running against stale,
      # pre-crawl data.
      - name: Plant freshness sentinel
        env:
          ALGOLIA_APP_ID: ${{ secrets.ALGOLIA_APP_ID }}
          ALGOLIA_ADMIN_API_KEY: ${{ secrets.ALGOLIA_ADMIN_API_KEY }}
        run: node algolia/plant-freshness-sentinel.js

      - name: Run docsearch-scraper
        env:
          APPLICATION_ID: ${{ secrets.ALGOLIA_APP_ID }}
          API_KEY: ${{ secrets.ALGOLIA_ADMIN_API_KEY }}
        run: |
          CONFIG=$(cat search-config-min.json)
          docker run \
            -e APPLICATION_ID="$APPLICATION_ID" \
            -e API_KEY="$API_KEY" \
            -e CONFIG="$CONFIG" \
            algolia/docsearch-scraper

      - name: Wait for fresh crawl
        env:
          ALGOLIA_APP_ID: ${{ secrets.ALGOLIA_APP_ID }}
          ALGOLIA_ADMIN_API_KEY: ${{ secrets.ALGOLIA_ADMIN_API_KEY }}
        run: node algolia/wait-for-fresh-crawl.js

      - name: Prune v5.35.0 records that duplicate v6 content
        env:
          ALGOLIA_APP_ID: ${{ secrets.ALGOLIA_APP_ID }}
          ALGOLIA_ADMIN_API_KEY: ${{ secrets.ALGOLIA_ADMIN_API_KEY }}
        run: node algolia/prune-v5-duplicates.js

      - name: Tag current-version records with presentInV5
        env:
          ALGOLIA_APP_ID: ${{ secrets.ALGOLIA_APP_ID }}
          ALGOLIA_ADMIN_API_KEY: ${{ secrets.ALGOLIA_ADMIN_API_KEY }}
        run: node algolia/tag-present-in-v5.js
